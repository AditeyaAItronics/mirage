seed: 42
counts:
  simple: 500            # 250 positive + 250 negative
  negation_pos: 500      # "not <positive>" -> expected negative (scored)
  negation_neg: 250      # "not <negative>" -> reported separately (ambiguous)
  negation_dir: 500      # "X" vs "not X" pairs, positive X (scored, D27)
  negation_dir_neg: 250  # "X" vs "not X" pairs, negative X (unscored probe)
  typo: 500              # invariance pairs: typo in the sentiment adjective
  typo_noun: 500         # control: typo in the noun, adjective intact (C11, D37)
  name_swap: 250         # invariance pairs: unseen Indian vs Western names, gender-matched
  name_shortcut: 500     # invariance pairs: film people with positive vs negative labels (D32)
# (positive-associated, negative-associated) surnames, picked from SST-2 training labels by
# mirage.behavioral.names.pick_pairs; evidence in results/name_associations.csv
# D45: every film person with >= 15 training phrases, in the same sentences (separate probe)
name_probe:
  n_sentences: 40
  seed: 42
  min_phrases: 15
  models: [logreg, dtree, rf, mnb, gnb, distilbert, distilbert_hf, roberta_large]
  bootstrap_resamples: 1000
name_pairs:
  - [Kidman, Seagal]
  - [Binoche, Hopkins]
  - [Spielberg, Costner]
  - [Nicholson, Ritchie]
  - [Diesel, Tarantino]
  - [Kline, Sandler]
