seed: 42
vectorizer:
  ngram_range: [1, 2]
  min_df: 2
  sublinear_tf: true
models:
  logreg:
    grid: {C: [0.1, 1, 10, 30, 100]}   # 10 was the edge of the old grid on the leak-free split
  dtree:
    # D29: leaves of 1 example give only 0/1 probabilities (ECE 0.34, no confidence signal) and a
    # 2,956-level tree. Leaves of >= 10 cost 0.2 points of test accuracy and make confidence usable.
    grid: {max_depth: [null], min_samples_leaf: [10, 20, 50]}
  rf:
    n_estimators: 300
    grid: {max_depth: [30, null]}
  mnb:
    grid: {alpha: [0.1, 0.5, 1.0]}
  gnb:
    svd_components: 300
    grid: {}
explain_tree_depth: 4
