seed: 42
sst2_dataset: stanfordnlp/sst2
# GLUE hides SST-2 test labels; this public copy carries the original Stanford labels (D22).
sst2_test_dataset: SetFit/sst2
imdb_dataset: stanfordnlp/imdb
heldout_frac: 0.05
imdb_sample_size: 10000
# Every model reads the same text: reviews longer than head + tail words keep only those (C1).
imdb_head_words: 220
imdb_tail_words: 140
# Matched on normalized text, so "doesn't" has already become "does n't".
negation_words: ["not", "never", "no", "nothing", "n't"]
