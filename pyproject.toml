[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirage"
version = "0.1.0"
description = "Detecting shortcut learning in sentiment classifiers (classical, Gaussian and transformer models)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "pyyaml>=6",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tabulate>=0.9",
]

[project.optional-dependencies]
# Heavy deep-learning stack: needed for data download, DistilBERT, IG and embeddings.
# Kept optional so the classical pipeline and the test suite run on a bare CPU install.
dl = [
    "datasets>=2.18",
    "transformers>=4.41",  # needs the eval_strategy argument
    "accelerate>=0.29",
    "torch>=2.2",
    "sentence-transformers>=2.7",
    "captum>=0.7",
]
# The live Shortcut Explorer (app/shortcut_explorer.py, D41); also needs the dl extra.
demo = ["streamlit>=1.40"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
mirage = "mirage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = ["E501"]
